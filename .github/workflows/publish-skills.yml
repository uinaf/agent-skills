name: Publish Skills

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/skills/review.sh"
      - "scripts/skills/publish.sh"
      - ".github/workflows/publish-skills.yml"
      - ".github/workflows/review-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Verify and review skills
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    env:
      TESSL_AUTO_UPDATE_INTERVAL_MINUTES: "0"
      TESSL_THRESHOLD: "100"
      TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          standalone: true
          run_install: |
            - args: [--frozen-lockfile]

      - name: Run canonical skill verification
        run: pnpm run verify:skills

  publish:
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    environment:
      name: release
    concurrency:
      group: publish-skills-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Tessl
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          standalone: true

      - name: Authorize version-bump pushes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Publish changed plugins
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          TESSL_WORKSPACE: uinaf
          TESSL_PUBLISH_ALL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: ./scripts/skills/publish.sh

      - name: Commit published plugin versions
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- skills; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills
          git commit -m "chore: sync published plugin versions [skip ci]"
          git push
