interface:
  display_name: "GitHub Setup"
  short_description: "Standardize repo settings and CI/CD"
  default_prompt: |
    Use $gh-setup.

    Goal: align GitHub policy, Actions, secrets, and delivery with the repo's real operating model.

    Inspect the repo and live settings first. Align merge/ruleset policy, permissions, templates, Environments, tags, and secrets. Pull requests run read-only verification. Packages run verification before release; apps add e2e, deploy, monitoring, and rollback. For immutable releases, use draft-first publication only when assets or other release mutations follow creation. When deterministic source files change, prefer the release tool's native GitHub App-signed writeback. Prove all applicable release, signature, default-branch, registry, and tap state from live evidence. Use same-job output only for ephemeral handoff in the current run. Store recovery payloads in a registry, release, image, or provider package—not Actions artifacts.

    Boundaries: keep provider and organization details with their owner. Pause wiring when verification, runtime proof, or monitoring entrypoints are missing. Keep affected docs aligned.

    Output: no conversational opener. Use bullet labels only: files changed, settings, environments, release/deploy target, evidence, risks, and next. Say when live GitHub settings were not checked.

    Stop rules: block when credentials, target environment, ruleset policy, or trusted delivery refs cannot be confirmed safely.

policy:
  allow_implicit_invocation: false
